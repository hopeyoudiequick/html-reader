<!doctype html>
<html lang="it" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#161616">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lettore">
  <title>Lettore</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="library" class="view">
    <header class="lib-head">
      <h1>Libreria</h1>
      <button id="btn-add" class="pill" type="button">Aggiungi</button>
    </header>
    <ul id="book-list" class="book-list"></ul>
    <p id="empty" class="empty" hidden>
      Nessun libro ancora. Tocca <strong>Aggiungi</strong> e scegli uno o più file .html dal telefono (app File o iCloud Drive).
    </p>
  </main>

  <section id="reader" class="view" hidden>
    <div id="rd-view">
      <div id="rd-stage">
        <div id="rd-content"></div>
      </div>
    </div>
    <div id="rd-dim"></div>
    <div id="hairline"><i></i></div>

    <header id="bar-top" class="bar">
      <button id="btn-back" class="icon" type="button" aria-label="Torna alla libreria">‹</button>
      <div class="bar-title">
        <div id="bar-book"></div>
        <div id="bar-section"></div>
      </div>
      <button id="btn-menu" class="icon" type="button" aria-label="Impostazioni">Aa</button>
    </header>

    <footer id="bar-bottom" class="bar">
      <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Posizione nel capitolo">
      <div class="bar-row">
        <span id="bar-progress"></span>
        <button id="btn-toc" class="pill" type="button">Indice</button>
      </div>
    </footer>
  </section>

  <div id="sheet-backdrop" hidden></div>
  <section id="sheet" class="sheet" aria-label="Indice e impostazioni">
    <div class="grip"></div>
    <nav class="tabs">
      <button class="tab on" data-tab="toc" type="button">Indice</button>
      <button class="tab" data-tab="settings" type="button">Impostazioni</button>
    </nav>
    <div id="pane-toc" class="pane">
      <ol id="toc-list"></ol>
    </div>
    <div id="pane-settings" class="pane" hidden>
      <div class="row">
        <span>Dimensione testo</span>
        <div class="stepper">
          <button id="fs-dec" type="button" aria-label="Riduci il testo">A−</button>
          <output id="fs-val"></output>
          <button id="fs-inc" type="button" aria-label="Ingrandisci il testo">A+</button>
        </div>
      </div>
      <label class="row">
        <span>Carattere</span>
        <select id="set-font">
          <option value="serif">Serif (Iowan)</option>
          <option value="charter">Charter</option>
          <option value="georgia">Georgia</option>
          <option value="sans">Sans-serif</option>
        </select>
      </label>
      <label class="row col">
        <span>Interlinea <output id="lh-val"></output></span>
        <input id="set-lh" type="range" min="1.3" max="2.1" step="0.05">
      </label>
      <div class="row">
        <span>Margini</span>
        <div class="seg" data-key="margin">
          <button type="button" data-value="small">Stretti</button>
          <button type="button" data-value="medium">Medi</button>
          <button type="button" data-value="large">Ampi</button>
        </div>
      </div>
      <label class="row">
        <span>Testo giustificato</span>
        <input id="set-justify" type="checkbox">
      </label>
      <div class="row">
        <span>Tema</span>
        <div class="seg" data-key="theme">
          <button type="button" data-value="light">Chiaro</button>
          <button type="button" data-value="sepia">Seppia</button>
          <button type="button" data-value="dark">Scuro</button>
          <button type="button" data-value="black">Nero</button>
        </div>
      </div>
      <label class="row col">
        <span>Luminosità <output id="br-val"></output></span>
        <input id="set-brightness" type="range" min="30" max="100" step="5">
      </label>
      <div class="row">
        <span>Lettura</span>
        <div class="seg" data-key="mode">
          <button type="button" data-value="pages">Pagine</button>
          <button type="button" data-value="scroll">Scorrimento</button>
        </div>
      </div>
      <label class="row">
        <span>Modalità immersiva<small>Nasconde tutti i pulsanti. Doppio tocco al centro per aprire il menu.</small></span>
        <input id="set-immersive" type="checkbox">
      </label>
      <label class="row">
        <span>Riapri l'ultimo libro all'avvio</span>
        <input id="set-resume" type="checkbox">
      </label>
      <label class="row">
        <span>Schermo sempre acceso</span>
        <input id="set-awake" type="checkbox">
      </label>
      <button id="btn-home" class="wide" type="button">Torna alla libreria</button>
    </div>
  </section>

  <div id="busy" hidden>Importazione in corso…</div>
  <div id="toast" role="status" aria-live="polite"></div>
  <input id="file-input" type="file" accept=".html,.htm,.xhtml,text/html" multiple hidden>

  <script type="module" src="js/app.js"></script>
</body>
</html>
